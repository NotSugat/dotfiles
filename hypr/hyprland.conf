#autogenerated = 1 # remove this line to remove the warning
# Force NVIDIA rendering
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,0
env = WLR_DRM_NO_ATOMIC,1

# NVIDIA-specific cursor workaround
env = XCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1

# Force GPU acceleration
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only
env = __GLX_SYNC_DISPLAY_DEVICE,HDMI-A-1
env = __GL_SYNC_TO_VBLANK,1

# NVIDIA-specific environment variables
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Disable forced vsync for OpenGL
env = __GL_SYNC_TO_VBLANK,0
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0


# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=eDP-1,1920x1080@60,0x0,1
# monitor=HDMI-A-1,1920x1080@60,1920x0,1
monitor=HDMI-A-1,1920x1080@180,1920x0,1,bitdepth,10,vrr,0
# monitor=HDMI-A-1,1920x1080@100,1920x0,1
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1
# monitor=HDMI-A-1,1920x1080@60,1920x0,1,mirror,eDP-1
# monitor=HDMI-A-1,1024x768@60,1920x0,1,mirror,eDP-1
# monitor=HDMI-A-1,1600x900@60,1920x0,1
# monitor=HDMI-A-1,1600x900@60,1920x0,mirror,eDP-1



# Execute your favoritt apps at launch
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = ~/.config/waybar/launch.sh 
exec-once = env LD_PRELOAD=/usr/lib/spotify-adblock.so spotify --uri=%U
# exec-once = sudo kmonad ~/.config/kmonad/config.kbd 
exec-once = blueman-manager 
exec-once = discord 
# exec-once = brave
# exec-once = microsoft-edge-beta
exec-once = hyprpm reload -n
# exec-once = kitty
exec-once = swaybg -m fill -i ~/Downloads/bgm.png
exec-once = copyq --start-server
exec-once = nm-applet
exec-once = obsidian
exec-once = dunst
# exec-once = waybar & hyprpaper & firefox

# exec-once=/usr/lib/polkit-kde-authentication-agent-1

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 250
    repeat_delay = 200

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = .4 # -1.0 - 1.0, 0 means no modification.
}
  
cursor {
    no_hardware_cursors = true
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 4
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = master
    allow_tearing = true
}

 misc {
#     focus_on_activate = true
    vfr = false
    vrr = 0
}

opengl {
    nvidia_anti_flicker = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 7
        passes = 2
        new_optimizations = true
    }

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = no

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 2, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
    permanent_direction_override = 1
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    allow_small_split = false
    special_scale_factor = 0.8
    mfact = 0.60
    new_on_active = true
    new_on_top = false 
    # no_gaps_when_only = 0
    orientation = left 
    # inherit_fullscreen = true
    # always_center_master = false
    smart_resizing = true


}

gestures {
    gesture = 3, horizontal, workspace

    workspace_swipe_distance = 700
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_create_new = true

    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 0

}
