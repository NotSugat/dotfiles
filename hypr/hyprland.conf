# screen sharing fix
windowrule = opacity 0.0 override 0.0 override, match:class ^(xwaylandvideobridge)$
windowrule = no_anim 1, match:class ^(xwaylandvideobridge)$
windowrule = no_focus 1, match:class ^(xwaylandvideobridge)$
windowrule = no_initial_focus 1, match:class ^(xwaylandvideobridge)$
# Workspace
# windowrule = workspace 1, ^(kitty)$
# Workspace Rules
windowrule = workspace 1, match:class ^(.*Alacritty.*)$
windowrule = workspace 2, match:class ^(.*zen.*)$
windowrule = workspace 2, match:class ^(.*brave.*)$
windowrule = workspace 6, match:class ^(.*Chromium.*)$
windowrule = workspace 6, match:title ^(.*Chromium.*)$
windowrule = workspace 9, match:class ^(.*thorium.*)$
windowrule = workspace 10, match:class ^(.*notion.*)$
windowrule = workspace 4, match:class ^(.*discord.*)$
windowrule = workspace 4, match:class ^(.*Slack.*)$
windowrule = workspace 3, match:class ^(.*microsoft.*)$
windowrule = workspace 4, match:class ^(.*webcord.*)$
windowrule = workspace 4, match:class ^(.*armcord.*)$
windowrule = workspace 5, match:class ^(.*Spotify.*)$
windowrule = workspace 8, match:class ^(.*obsidian.*)$

# Opacity Control
# windowrule = opacity 0.8 0.8, match:class ^(kitty)$
# windowrule = opacity 0.8 0.8, match:class ^(Alacritty)$
windowrule = opacity 0.8 0.8, match:class ^(thunar)$
# windowrule = opacity 0.8 0.8, match:class ^(firefox)$

windowrule = opacity 1.0 1.0, match:class ^(firefox)$, match:title ^(.*Figma.*)$
windowrule = opacity 1.0 1.0, match:class ^(firefox)$, match:title ^(.*YouTube.*)$
# windowrule = opacity 0.8 0.8, match:class ^(.*Brave.*)$
# windowrule = opacity 0.8 0.8, match:class ^(.*)$

# Floating Windows
windowrule = float 1, match:class ^(thunar)$
windowrule = float 1, match:class ^(pavucontrol)$
windowrule = float 1, match:class ^(blueman-manager)$
windowrule = size 650 400, match:class ^(blueman-manager)$
windowrule = workspace special silent, match:class ^(PenTablet)$


